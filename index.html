<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ecd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Običejní lidé">
<meta property="og:description" content="Satirická hra o rozpoznávání obyčejných lidí. Hodně štěstí.">
<title>Običejní lidé</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root {
    --paper: #f4ecd8;
    --ink: #1d1a16;
    --red: #d7262b;
    --blue: #1f4e9c;
    --green: #2e8b3d;
    --muted: #6b6255;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { -webkit-text-size-adjust: 100%; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none; }
  body {
    background: var(--paper);
    background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px);
    background-size: 14px 14px;
    color: var(--ink);
    font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
    font-size: 20px;
    overflow-x: hidden;
  }
  header {
    text-align: center;
    padding: 24px 16px 8px;
  }
  h1 {
    font-family: 'Bangers', Impact, sans-serif;
    font-size: clamp(42px, 9vw, 84px);
    letter-spacing: 3px;
    margin: 0;
    color: var(--red);
    text-shadow: 3px 3px 0 var(--ink);
    transform: rotate(-2deg);
  }
  .tagline { color: var(--muted); margin: 4px 0 0; }
  .score {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: #fff;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .screen { display: none; }
  .screen.active { display: block; animation: pop .35s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  h2 { font-family: 'Bangers', Impact, sans-serif; letter-spacing: 1.5px; font-size: 34px; text-align: center; margin: 8px 0 18px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 10px 8px 12px;
    text-align: center;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
    font: inherit;
    color: inherit;
  }
  @media (hover: hover) {
    .card:hover { transform: translate(-2px,-2px) rotate(-1deg); box-shadow: 6px 6px 0 var(--ink); }
  }
  .card:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }
  .card svg { width: 100%; height: 150px; }
  .card .name { font-size: 22px; line-height: 1.1; }
  .card .shamed { font-size: 15px; color: var(--red); min-height: 18px; }

  .stage {
    position: relative;
    max-width: 520px;
    margin: 0 auto;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 16px;
    overflow: hidden;
  }
  .stage .who { text-align: center; font-size: 26px; margin: 0; }
  .stage .bio { text-align: center; color: var(--muted); font-size: 17px; margin: 2px 0 6px; }
  .figure-wrap { position: relative; height: 300px; }
  .figure-wrap svg.man { position: absolute; left: 50%; top: 0; width: 240px; height: 300px; transform: translateX(-50%); transform-origin: 50% 100%; }

  .question {
    font-family: 'Bangers', Impact, sans-serif;
    font-size: clamp(28px, 6vw, 40px);
    letter-spacing: 1.5px;
    text-align: center;
    margin: 10px 0;
  }
  .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-family: 'Bangers', Impact, sans-serif;
    font-size: 30px;
    letter-spacing: 2px;
    padding: 8px 34px;
    border: 3px solid var(--ink);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    color: #fff;
  }
  .btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.yes { background: var(--green); }
  .btn.no { background: var(--red); }
  .btn.next { background: var(--blue); font-size: 24px; }

  .verdict {
    text-align: center;
    font-size: 24px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 3px dashed var(--ink);
    margin: 10px 0;
  }
  .verdict.bad { background: #ffd9d9; }
  .verdict.good { background: #dff3df; }
  .verdict b { font-family: 'Bangers', Impact, sans-serif; letter-spacing: 1px; font-size: 30px; display: block; }
  .hidden { display: none !important; }

  /* shaming */
  .shaming svg.man { animation: cower 1.6s ease-in-out infinite; }
  .shaming .face-blush { opacity: 1 !important; transition: opacity .5s; }
  .shaming .tear { animation: tear 1s linear infinite; opacity: 1; }
  .shaming .tear.t2 { animation-delay: .5s; }
  @keyframes cower {
    0%,100% { transform: translateX(-50%) scale(.9, .86) rotate(-3deg); }
    50% { transform: translateX(-50%) scale(.88, .82) rotate(3deg); }
  }
  @keyframes tear { from { transform: translateY(0); opacity: 1; } to { transform: translateY(40px); opacity: 0; } }

  .projectile {
    position: absolute;
    font-size: 34px;
    pointer-events: none;
  }
  .splat {
    position: absolute;
    width: 34px; height: 26px;
    background: var(--red);
    border-radius: 50% 40% 55% 45%;
    opacity: .85;
    animation: splat .3s ease-out;
  }
  @keyframes splat { from { transform: scale(0); } to { transform: scale(1); } }

  .hanba {
    position: absolute;
    font-family: 'Bangers', Impact, sans-serif;
    color: var(--red);
    -webkit-text-stroke: 1.5px var(--ink);
    font-size: 40px;
    pointer-events: none;
    white-space: nowrap;
  }
  .bell {
    position: absolute; left: 12px; top: 12px; font-size: 34px;
    animation: ring .25s ease-in-out infinite alternate;
    transform-origin: 50% 0;
  }
  @keyframes ring { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }

  .shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: none; }
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }
  footer { text-align: center; color: var(--muted); font-size: 15px; padding: 24px 16px; }
</style>
</head>
<body>
<header>
  <h1>Običejní lidé</h1>
  <p class="tagline">Satirická hra o rozpoznávání obyčejných lidí. Hodně štěstí.</p>
  <div class="score">Zahanbeno: <span id="score">0</span> · Správně: <span id="correct">0</span> · Naivně: <span id="naive">0</span></div>
</header>

<main>
  <section id="pick" class="screen active">
    <h2>Vyber si panáčka</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section id="play" class="screen">
    <div class="stage" id="stage">
      <p class="who" id="who"></p>
      <p class="bio" id="bio"></p>
      <div class="figure-wrap" id="figure"></div>

      <div id="ask">
        <div class="question">Je toto obyčejný člověk?</div>
        <div class="buttons">
          <button class="btn yes" id="yesBtn">ANO</button>
          <button class="btn no" id="noBtn">NE</button>
        </div>
      </div>

      <div id="result" class="hidden">
        <div class="verdict" id="verdict"></div>
        <div class="buttons"><button class="btn next" id="nextBtn">Další panáček →</button></div>
      </div>
    </div>
  </section>
</main>

<footer>Všechny postavy jsou smyšlené. Jakákoli podobnost s obyčejnými lidmi je vyloučena.</footer>

<script>
const PEOPLE = [
  { id: 'miliardar', name: 'Pan Miliardář', bio: 'Chápe starosti důchodců. Má jich 40 000 na výplatní pásce.', acc: 'tophat', color: '#2b2b2b', prop: 'money' },
  { id: 'poslanec', name: 'Pan Poslanec', bio: 'Jezdí MHD. Jednou. Na kameru.', acc: 'tie', color: '#1f4e9c', prop: 'briefcase' },
  { id: 'ministr', name: 'Paní Ministryně', bio: 'Ví, kolik stojí rohlík. Odhadem 45 Kč.', acc: 'bow', color: '#8a2be2', prop: 'mic', f: true },
  { id: 'hejtman', name: 'Pan Hejtman', bio: 'Na pivu s lidem. V salonku. S ochrankou.', acc: 'cap', color: '#d7262b', prop: 'beer' },
  { id: 'lobbista', name: 'Pan Lobbista', bio: 'Jen poradce. Neformální. Pro všechny vlády.', acc: 'shades', color: '#444', prop: 'briefcase' },
  { id: 'influencer', name: 'Influencer s kampaní', bio: '„Taky jsem z lidu.“ Sponzorováno.', acc: 'shades', color: '#ff7a00', prop: 'phone' },
  { id: 'europoslanec', name: 'Pan Europoslanec', bio: 'Bojuje proti Bruselu. Z Bruselu. Za bruselský plat.', acc: 'crown', color: '#003399', prop: 'flag' },
  { id: 'kmotr', name: 'Pan Kmotr', bio: 'Nikdy nebyl ve vládě. Vláda byla u něj.', acc: 'fedora', color: '#3a2a1a', prop: 'cigar' },
];

const stats = { score: 0, correct: 0, naive: 0, per: {} };

function accessory(type) {
  switch (type) {
    case 'tophat': return '<rect x="78" y="10" width="44" height="36" fill="#111"/><rect x="66" y="42" width="68" height="8" fill="#111"/><rect x="78" y="34" width="44" height="6" fill="#d7262b"/>';
    case 'tie': return '<path d="M100 98 l-7 8 7 34 7-34 z" fill="#d7262b" stroke="#1d1a16" stroke-width="2"/>';
    case 'bow': return '<path d="M86 30 l14 8 14-8 v16 l-14-8 -14 8z" fill="#ff4fa3" stroke="#1d1a16" stroke-width="2"/>';
    case 'cap': return '<path d="M70 52 q30-38 60 0 z" fill="#d7262b" stroke="#1d1a16" stroke-width="3"/><path d="M128 50 h28" stroke="#d7262b" stroke-width="7" stroke-linecap="round"/><text x="92" y="48" font-size="11" font-family="Bangers" fill="#fff">SILNÍ</text>';
    case 'shades': return '<rect x="76" y="62" width="20" height="11" rx="3" fill="#111"/><rect x="104" y="62" width="20" height="11" rx="3" fill="#111"/><path d="M96 66 h8" stroke="#111" stroke-width="3"/>';
    case 'crown': return '<path d="M74 46 l6-26 12 14 8-18 8 18 12-14 6 26z" fill="#ffcc00" stroke="#1d1a16" stroke-width="3"/>';
    case 'fedora': return '<path d="M64 50 h72" stroke="#3a2a1a" stroke-width="8" stroke-linecap="round"/><path d="M76 50 q2-32 24-32 q22 0 24 32z" fill="#3a2a1a"/>';
  }
  return '';
}

function prop(type) {
  switch (type) {
    case 'money': return '<g transform="translate(150 150)"><circle r="20" fill="#c9a227" stroke="#1d1a16" stroke-width="3"/><text x="-9" y="8" font-size="24" font-family="Bangers" fill="#1d1a16">$</text></g>';
    case 'briefcase': return '<g transform="translate(134 158)"><rect width="36" height="26" rx="3" fill="#6b3e1d" stroke="#1d1a16" stroke-width="3"/><path d="M12 0 v-6 h12 v6" fill="none" stroke="#1d1a16" stroke-width="3"/></g>';
    case 'mic': return '<g transform="translate(150 120)"><rect x="-4" y="0" width="8" height="26" fill="#333"/><circle r="10" fill="#555" stroke="#1d1a16" stroke-width="3"/></g>';
    case 'beer': return '<g transform="translate(140 130)"><rect width="22" height="30" fill="#f2b632" stroke="#1d1a16" stroke-width="3"/><rect y="-6" width="22" height="8" rx="4" fill="#fff" stroke="#1d1a16" stroke-width="2"/></g>';
    case 'phone': return '<g transform="translate(142 116)"><rect width="18" height="30" rx="3" fill="#111"/><rect x="3" y="4" width="12" height="20" fill="#6cf"/></g>';
    case 'flag': return '<g transform="translate(150 80)"><path d="M0 0 v80" stroke="#1d1a16" stroke-width="3"/><rect width="38" height="26" fill="#003399"/><circle cx="19" cy="13" r="7" fill="none" stroke="#ffcc00" stroke-width="2" stroke-dasharray="2 2"/></g>';
    case 'cigar': return '<g transform="translate(106 86)"><rect width="22" height="5" fill="#6b3e1d"/><circle cx="23" cy="2" r="2.5" fill="#ff5a00"/><path d="M26 -4 q6 -8 0 -16" stroke="#aaa" stroke-width="2" fill="none"/></g>';
  }
  return '';
}

function stickman(p, cls = '') {
  const c = p.color;
  return `<svg class="${cls}" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#1d1a16" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="100" y1="96" x2="100" y2="175" stroke="${c}" stroke-width="7"/>
      <line x1="100" y1="115" x2="58" y2="155"/>
      <line x1="100" y1="115" x2="145" y2="150"/>
      <line x1="100" y1="175" x2="70" y2="240"/>
      <line x1="100" y1="175" x2="130" y2="240"/>
    </g>
    <circle cx="100" cy="68" r="28" fill="#fff" stroke="#1d1a16" stroke-width="5"/>
    <ellipse class="face-blush" cx="84" cy="78" rx="7" ry="4" fill="#ff6b6b" opacity="0"/>
    <ellipse class="face-blush" cx="116" cy="78" rx="7" ry="4" fill="#ff6b6b" opacity="0"/>
    <circle cx="90" cy="66" r="3" fill="#1d1a16"/>
    <circle cx="110" cy="66" r="3" fill="#1d1a16"/>
    <path class="mouth" d="M88 80 q12 9 24 0" stroke="#1d1a16" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle class="tear" cx="90" cy="74" r="3" fill="#4aa3ff" opacity="0"/>
    <circle class="tear t2" cx="110" cy="74" r="3" fill="#4aa3ff" opacity="0"/>
    ${accessory(p.acc)}
    ${prop(p.prop)}
  </svg>`;
}

const $ = id => document.getElementById(id);
let current = null;
let shameTimer = null;

function renderGrid() {
  $('grid').innerHTML = PEOPLE.map(p => `
    <button class="card" data-id="${p.id}">
      ${stickman(p)}
      <div class="name">${p.name}</div>
      <div class="shamed">${stats.per[p.id] ? '🍅 × ' + stats.per[p.id] : ''}</div>
    </button>`).join('');
  document.querySelectorAll('.card').forEach(el => el.onclick = () => start(el.dataset.id));
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function start(id) {
  current = PEOPLE.find(p => p.id === id);
  $('who').textContent = current.name;
  $('bio').textContent = current.bio;
  $('figure').innerHTML = stickman(current, 'man');
  $('figure').classList.remove('shaming');
  $('ask').classList.remove('hidden');
  $('result').classList.add('hidden');
  $('stage').querySelectorAll('.projectile,.splat,.hanba,.bell').forEach(n => n.remove());
  show('play');
}

const YES_LINES = [
  'Opravdu? Obyčejný člověk má v garáži tři Bentley?',
  'Ne. Obyčejní lidé nemají vlastní PR oddělení.',
  'Obyčejný člověk nepočítá úspory na stovky milionů.',
  'Kdepak. Obyčejní lidé čekají na lékaře, ne na kameramana.',
];

function answer(saidYes) {
  $('ask').classList.add('hidden');
  const v = $('verdict');
  if (saidYes) {
    stats.naive++;
    v.className = 'verdict bad';
    v.innerHTML = `<b>ŠPATNĚ! 🙄</b>${YES_LINES[Math.floor(Math.random() * YES_LINES.length)]}<br>A protože není obyčejný člověk, potrestáme ${current.f ? 'ji' : 'ho'} ostudou.`;
    $('stage').classList.add('shake');
    setTimeout(() => $('stage').classList.remove('shake'), 400);
  } else {
    stats.correct++;
    v.className = 'verdict good';
    v.innerHTML = `<b>Ano, máš pravdu,</b>toto není obyčejný člověk.<br>A protože není obyčejný člověk, potrestáme ${current.f ? 'ji' : 'ho'} ostudou.`;
  }
  stats.score++;
  stats.per[current.id] = (stats.per[current.id] || 0) + 1;
  updateScore();
  $('result').classList.remove('hidden');
  shame();
}

function shame() {
  const fig = $('figure');
  const stage = $('stage');
  fig.classList.add('shaming');
  fig.querySelector('.mouth').setAttribute('d', 'M88 86 q12 -9 24 0');

  const bell = document.createElement('div');
  bell.className = 'bell';
  bell.textContent = '🔔';
  stage.appendChild(bell);

  const items = ['🍅', '🍅', '🥚', '🥬', '🍅', '🧻'];
  const words = ['HANBA!', 'FUJ!', 'STYĎ SE!', 'SHAME!', 'HANBA!'];
  let n = 0;
  clearInterval(shameTimer);
  shameTimer = setInterval(() => {
    const figRect = fig.getBoundingClientRect();
    const stRect = stage.getBoundingClientRect();
    const cx = figRect.left - stRect.left + figRect.width / 2;
    const cy = figRect.top - stRect.top + 110;
    const fromLeft = Math.random() < .5;

    const p = document.createElement('div');
    p.className = 'projectile';
    p.textContent = items[Math.floor(Math.random() * items.length)];
    p.style.left = '0px'; p.style.top = '0px';
    const sx = fromLeft ? -40 : stRect.width + 10;
    const sy = cy + 80 + Math.random() * 60;
    const tx = cx - 17 + (Math.random() * 60 - 30);
    const ty = cy - 20 + (Math.random() * 90 - 30);
    p.style.transform = `translate(${sx}px, ${sy}px)`;
    stage.appendChild(p);
    p.animate([
      { transform: `translate(${sx}px, ${sy}px) rotate(0deg)`, opacity: 1 },
      { opacity: 1, offset: .85 },
      { transform: `translate(${tx}px, ${ty}px) rotate(540deg)`, opacity: 0 },
    ], { duration: 900, easing: 'cubic-bezier(.3,.1,.6,1)', fill: 'forwards' });
    setTimeout(() => {
      p.remove();
      const s = document.createElement('div');
      s.className = 'splat';
      s.style.left = tx + 'px'; s.style.top = (ty + 6) + 'px';
      stage.appendChild(s);
    }, 850);

    if (n % 2 === 0) {
      const h = document.createElement('div');
      h.className = 'hanba';
      h.textContent = words[Math.floor(Math.random() * words.length)];
      h.style.left = (10 + Math.random() * (stRect.width - 160)) + 'px';
      h.style.top = (40 + Math.random() * 180) + 'px';
      const r = (Math.random() * 30 - 15) + 'deg';
      h.style.opacity = '0';
      stage.appendChild(h);
      h.animate([
        { transform: `scale(.2) rotate(${r})`, opacity: 0 },
        { transform: `scale(1.2) rotate(${r})`, opacity: 1, offset: .2 },
        { transform: `scale(1) translateY(-40px) rotate(${r})`, opacity: 0 },
      ], { duration: 1400, easing: 'ease-out', fill: 'forwards' });
      setTimeout(() => h.remove(), 1400);
    }
    if (++n > 12) clearInterval(shameTimer);
  }, 280);
}

function updateScore() {
  $('score').textContent = stats.score;
  $('correct').textContent = stats.correct;
  $('naive').textContent = stats.naive;
}

$('yesBtn').onclick = () => answer(true);
$('noBtn').onclick = () => answer(false);
$('nextBtn').onclick = () => { clearInterval(shameTimer); renderGrid(); show('pick'); };

renderGrid();
</script>
</body>
</html>
